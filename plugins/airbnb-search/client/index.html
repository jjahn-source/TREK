<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- trek:ui -->
  <style>
    .ab-wrap { margin: 16px; }
    .ab-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .ab-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .ab-field--loc { flex: 2 1 220px; position: relative; }
    .ab-field--date { flex: 1 1 130px; }
    .ab-field--num { flex: 0 1 90px; }
    .ab-form .trek-btn { flex: 0 0 auto; height: 38px; }

    .ab-suggest { position: absolute; top: 100%; left: 0; right: 0; z-index: 10; margin-top: 4px;
      max-height: 220px; overflow-y: auto; border-radius: 10px; }
    .ab-suggest:empty { display: none; }
    .ab-suggest .trek-row { cursor: pointer; padding: 8px 12px; }
    .ab-suggest .trek-row.is-active { background: var(--accent-subtle, rgba(127,127,127,.15)); }

    .ab-filters { display: none; flex-wrap: wrap; gap: 10px; align-items: flex-end;
      padding-top: 10px; border-top: 1px solid color-mix(in oklch, currentColor 12%, transparent); }
    .ab-filters.is-open { display: flex; }
    .ab-check { display: flex; align-items: center; gap: 6px; height: 38px; white-space: nowrap; }

    .ab-statusbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .ab-statusbar .trek-select { width: auto; }

    .ab-result { display: flex; gap: 14px; align-items: stretch; padding: 12px; cursor: pointer; }
    .ab-thumb { width: 110px; min-height: 84px; border-radius: 10px; object-fit: cover; flex: none;
      background: color-mix(in oklch, currentColor 8%, transparent); align-self: center; }
    .ab-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .ab-title-row { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
    .ab-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ab-price { font-weight: 700; white-space: nowrap; text-align: right; }
    .ab-price small { font-weight: 400; opacity: .7; display: block; }
    .ab-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ab-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .ab-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }

    .ab-details { padding: 0 12px 12px; display: none; }
    .ab-details.is-open { display: block; }
    .ab-details p { margin: 8px 0 0; white-space: pre-line; }
    .ab-photos { display: flex; gap: 8px; overflow-x: auto; padding-top: 10px; }
    .ab-photos img { height: 110px; border-radius: 8px; flex: none;
      background: color-mix(in oklch, currentColor 8%, transparent); min-width: 140px; object-fit: cover; }

    .ab-more { align-self: center; }

    @media (max-width: 560px) {
      .ab-result { flex-direction: column; }
      .ab-thumb { width: 100%; height: 140px; }
      .ab-title { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="trek-stack ab-wrap" id="root">
    <div class="trek-glass trek-stack" style="padding:16px">
      <div class="trek-title">Search Airbnb</div>
      <div class="ab-form">
        <div class="ab-field ab-field--loc">
          <label class="trek-label" for="location">Location</label>
          <input class="trek-input" id="location" placeholder="Paris, France" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-autocomplete="list" />
          <div class="trek-card ab-suggest" id="suggest" role="listbox"></div>
        </div>
        <div class="ab-field ab-field--date">
          <label class="trek-label" for="checkin">Check-in</label>
          <input class="trek-input" id="checkin" type="date" />
        </div>
        <div class="ab-field ab-field--date">
          <label class="trek-label" for="checkout">Check-out</label>
          <input class="trek-input" id="checkout" type="date" />
        </div>
        <div class="ab-field ab-field--num">
          <label class="trek-label" for="adults">Guests</label>
          <input class="trek-input" id="adults" type="number" min="1" max="16" value="2" />
        </div>
        <button class="trek-btn trek-btn--secondary" id="filtersToggle">Filters</button>
        <button class="trek-btn trek-btn--primary" id="search">Search</button>
      </div>

      <div class="ab-filters" id="filters">
        <div class="ab-field">
          <label class="trek-label" for="roomType">Type of place</label>
          <select class="trek-select" id="roomType">
            <option value="">Any type</option>
            <option value="Entire home/apt">Entire home</option>
            <option value="Private room">Private room</option>
            <option value="Shared room">Shared room</option>
            <option value="Hotel room">Hotel room</option>
          </select>
        </div>
        <div class="ab-field ab-field--num">
          <label class="trek-label" for="priceMin">Min $</label>
          <input class="trek-input" id="priceMin" type="number" min="0" placeholder="—" />
        </div>
        <div class="ab-field ab-field--num">
          <label class="trek-label" for="priceMax">Max $</label>
          <input class="trek-input" id="priceMax" type="number" min="0" placeholder="—" />
        </div>
        <div class="ab-field ab-field--num">
          <label class="trek-label" for="minBedrooms">Bedrooms+</label>
          <input class="trek-input" id="minBedrooms" type="number" min="1" max="16" placeholder="—" />
        </div>
        <div class="ab-field ab-field--num">
          <label class="trek-label" for="minBeds">Beds+</label>
          <input class="trek-input" id="minBeds" type="number" min="1" max="16" placeholder="—" />
        </div>
        <div class="ab-field ab-field--num">
          <label class="trek-label" for="minBathrooms">Baths+</label>
          <input class="trek-input" id="minBathrooms" type="number" min="1" max="16" placeholder="—" />
        </div>
        <label class="ab-check trek-muted"><input type="checkbox" id="instantBook" /> Instant Book</label>
        <label class="ab-check trek-muted"><input type="checkbox" id="superhostOnly" /> Superhost only</label>
      </div>

      <div class="ab-statusbar">
        <p class="trek-muted" id="status" style="margin:0"></p>
        <select class="trek-select" id="sort" hidden>
          <option value="relevance">Sort: Relevance</option>
          <option value="priceAsc">Sort: Price ↑</option>
          <option value="priceDesc">Sort: Price ↓</option>
          <option value="rating">Sort: Rating</option>
        </select>
      </div>
    </div>
    <div class="trek-stack" id="results"></div>
    <button class="trek-btn trek-btn--secondary ab-more" id="more" hidden>Load more</button>
  </div>

  <script>
    let tripId = null;
    const state = { params: null, listings: [], totalCount: 0, nextOffset: null, added: new Set() };

    function el(id) { return document.getElementById(id); }

    trek.onContext(async (ctx) => {
      if (ctx.tripId && tripId !== ctx.tripId) {
        tripId = ctx.tripId;
        await prefill();
        restoreLast();
      }
    });

    async function prefill() {
      try {
        const d = await trek.invoke('/defaults?tripId=' + tripId);
        if (d.location && !el('location').value) el('location').value = d.location;
        if (d.checkin && !el('checkin').value) el('checkin').value = d.checkin;
        if (d.checkout && !el('checkout').value) el('checkout').value = d.checkout;
      } catch { /* defaults are best-effort */ }
    }

    // Restore the previous search after a tab switch remounted the frame.
    async function restoreLast() {
      try {
        const d = await trek.invoke('/last?tripId=' + tripId);
        if (!d.listings || !d.listings.length) return;
        const p = d.params || {};
        el('location').value = p.location || el('location').value;
        if (p.checkin) el('checkin').value = p.checkin;
        if (p.checkout) el('checkout').value = p.checkout;
        if (p.adults) el('adults').value = p.adults;
        el('priceMin').value = p.priceMin ?? '';
        el('priceMax').value = p.priceMax ?? '';
        el('roomType').value = p.roomType || '';
        el('minBedrooms').value = p.minBedrooms ?? '';
        el('minBeds').value = p.minBeds ?? '';
        el('minBathrooms').value = p.minBathrooms ?? '';
        el('instantBook').checked = !!p.instantBook;
        el('superhostOnly').checked = !!p.superhostOnly;
        if (p.roomType || p.priceMin || p.minBedrooms || p.instantBook || p.superhostOnly) {
          el('filters').classList.add('is-open');
        }
        state.params = { ...p, tripId };
        state.listings = d.listings;
        state.totalCount = d.totalCount;
        state.nextOffset = d.nextOffset ?? null;
        state.added = new Set(d.addedIds || []);
        render();
      } catch { /* restore is best-effort */ }
    }

    el('filtersToggle').addEventListener('click', () => {
      el('filters').classList.toggle('is-open');
    });

    // ---- location autocomplete: debounced fetch + arrow-key navigation ----
    let suggestTimer = null;
    let suggestSeq = 0;
    let suggestItems = [];
    let suggestActive = -1;
    const locInput = el('location');
    const suggestBox = el('suggest');

    function closeSuggest() {
      suggestBox.replaceChildren();
      suggestItems = [];
      suggestActive = -1;
      locInput.setAttribute('aria-expanded', 'false');
    }

    function pickSuggest(i) {
      if (i >= 0 && i < suggestItems.length) locInput.value = suggestItems[i];
      closeSuggest();
    }

    function highlightSuggest(i) {
      suggestActive = i;
      [...suggestBox.children].forEach((row, idx) => row.classList.toggle('is-active', idx === i));
    }

    locInput.addEventListener('input', () => {
      clearTimeout(suggestTimer);
      const q = locInput.value.trim();
      if (q.length < 3) { closeSuggest(); return; }
      suggestTimer = setTimeout(() => fetchSuggestions(q), 250);
    });
    locInput.addEventListener('blur', () => setTimeout(closeSuggest, 150));
    locInput.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' && suggestItems.length) {
        e.preventDefault();
        highlightSuggest((suggestActive + 1) % suggestItems.length);
      } else if (e.key === 'ArrowUp' && suggestItems.length) {
        e.preventDefault();
        highlightSuggest((suggestActive - 1 + suggestItems.length) % suggestItems.length);
      } else if (e.key === 'Enter') {
        if (suggestActive >= 0) { e.preventDefault(); pickSuggest(suggestActive); }
        else { closeSuggest(); doSearch(); }
      } else if (e.key === 'Escape') {
        closeSuggest();
      }
    });

    async function fetchSuggestions(q) {
      const seq = ++suggestSeq;
      try {
        const data = await trek.invoke('/geocode?q=' + encodeURIComponent(q));
        if (seq !== suggestSeq) return;
        suggestItems = data.suggestions || [];
        suggestActive = -1;
        const rows = suggestItems.map((s, i) =>
          trek.ui.el('div', { class: 'trek-row', text: s, on: {
            mousedown: (e) => { e.preventDefault(); pickSuggest(i); },
            mouseenter: () => highlightSuggest(i),
          } })
        );
        suggestBox.replaceChildren(...rows);
        locInput.setAttribute('aria-expanded', rows.length ? 'true' : 'false');
      } catch { closeSuggest(); }
    }

    // ---- search ----
    function formParams() {
      return {
        location: locInput.value.trim(),
        checkin: el('checkin').value,
        checkout: el('checkout').value,
        adults: parseInt(el('adults').value, 10) || 1,
        priceMin: el('priceMin').value ? parseInt(el('priceMin').value, 10) : undefined,
        priceMax: el('priceMax').value ? parseInt(el('priceMax').value, 10) : undefined,
        roomType: el('roomType').value || undefined,
        minBedrooms: el('minBedrooms').value ? parseInt(el('minBedrooms').value, 10) : undefined,
        minBeds: el('minBeds').value ? parseInt(el('minBeds').value, 10) : undefined,
        minBathrooms: el('minBathrooms').value ? parseInt(el('minBathrooms').value, 10) : undefined,
        instantBook: el('instantBook').checked || undefined,
        superhostOnly: el('superhostOnly').checked || undefined,
        tripId,
      };
    }

    el('search').addEventListener('click', () => doSearch());
    el('sort').addEventListener('change', render);
    el('more').addEventListener('click', loadMore);

    async function doSearch() {
      const params = formParams();
      if (!params.location) { trek.notify('warning', 'Enter a location to search.'); return; }
      if (!params.checkin || !params.checkout) { trek.notify('warning', 'Pick check-in and check-out dates.'); return; }
      el('search').disabled = true;
      el('status').textContent = 'Searching Airbnb…';
      el('results').replaceChildren();
      el('more').hidden = true;
      try {
        const data = await trek.invoke('/search', { method: 'POST', body: params });
        state.params = params;
        state.listings = data.listings || [];
        state.totalCount = data.totalCount || 0;
        state.nextOffset = data.nextOffset ?? null;
        state.added = new Set(data.addedIds || []);
        render();
      } catch (e) {
        el('status').textContent = '';
        trek.notify('error', e.message);
      } finally {
        el('search').disabled = false;
      }
    }

    async function loadMore() {
      if (state.nextOffset == null || !state.params) return;
      const btn = el('more');
      btn.disabled = true;
      btn.textContent = 'Loading…';
      try {
        const data = await trek.invoke('/search', { method: 'POST', body: { ...state.params, offset: state.nextOffset } });
        const seen = new Set(state.listings.map((l) => l.id));
        const fresh = (data.listings || []).filter((l) => !seen.has(l.id));
        state.listings = state.listings.concat(fresh);
        state.nextOffset = fresh.length ? (data.nextOffset ?? null) : null;
        render();
      } catch (e) {
        trek.notify('error', e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Load more';
      }
    }

    function priceNumberOf(l) {
      const n = parseFloat(String(l.priceTotal || '').replace(/[^\d.]/g, ''));
      return Number.isFinite(n) ? n : null;
    }

    function sortedListings() {
      const mode = el('sort').value;
      const ls = [...state.listings];
      if (mode === 'priceAsc' || mode === 'priceDesc') {
        const dir = mode === 'priceAsc' ? 1 : -1;
        ls.sort((a, b) => ((priceNumberOf(a) ?? Infinity) - (priceNumberOf(b) ?? Infinity)) * dir);
      } else if (mode === 'rating') {
        ls.sort((a, b) => (b.rating ?? -1) - (a.rating ?? -1) || (b.reviewsCount ?? 0) - (a.reviewsCount ?? 0));
      }
      return ls;
    }

    function nightsOf(params) {
      if (!params || !params.checkin || !params.checkout) return null;
      const n = Math.round((new Date(params.checkout) - new Date(params.checkin)) / 86400000);
      return n > 0 ? n : null;
    }

    function render() {
      const listings = sortedListings();
      const total = Math.max(state.totalCount, listings.length);
      el('status').textContent = listings.length
        ? (total > listings.length
            ? 'Showing ' + listings.length + ' of ' + total + ' stays'
            : 'Showing ' + listings.length + ' stays')
        : 'No stays found for that search.';
      el('sort').hidden = listings.length < 2;
      const frag = document.createDocumentFragment();
      for (const l of listings) frag.appendChild(card(l, state.params));
      el('results').replaceChildren(frag);
      el('more').hidden = state.nextOffset == null || !listings.length;
      loadPhotos();
    }

    // ---- photos: proxied as data URIs (frame CSP blocks external images) ----
    const photoQueue = [];
    const photoMemo = new Map(); // url -> dataUri, so re-renders reuse instantly
    let photoWorkers = 0;

    function queuePhoto(img, url) {
      if (photoMemo.has(url)) { img.src = photoMemo.get(url); return; }
      photoQueue.push({ img, url });
    }

    function loadPhotos() {
      while (photoWorkers < 4 && photoQueue.length) { photoWorkers++; photoWorker(); }
    }

    async function photoWorker() {
      while (photoQueue.length) {
        const { img, url } = photoQueue.shift();
        if (!img.isConnected) continue;
        try {
          const data = await trek.invoke('/photo?url=' + encodeURIComponent(url));
          if (data.dataUri) {
            photoMemo.set(url, data.dataUri);
            if (img.isConnected) img.src = data.dataUri;
          }
        } catch { /* placeholder stays */ }
      }
      photoWorkers--;
    }

    // ---- expandable listing details ----
    function listingIdOf(l) {
      const m = String(l.listingUrl || '').match(/\/rooms\/(\d+)/);
      return m ? m[1] : null;
    }

    async function toggleDetails(l, detailsEl) {
      const open = detailsEl.classList.toggle('is-open');
      if (!open || detailsEl.dataset.loaded) return;
      const id = listingIdOf(l);
      if (!id) { detailsEl.textContent = 'No details available for this listing.'; return; }
      detailsEl.textContent = 'Loading details…';
      try {
        const d = await trek.invoke('/listing?id=' + id);
        detailsEl.dataset.loaded = '1';
        detailsEl.replaceChildren();
        if (d.rating != null) {
          detailsEl.appendChild(trek.ui.el('div', { class: 'ab-chips' }, [
            trek.ui.chip(d.rating + ' ★' + (d.reviewsCount != null ? ' (' + d.reviewsCount + ' reviews)' : ''), 'accent'),
          ]));
        }
        if (d.description) {
          detailsEl.appendChild(trek.ui.el('p', { class: 'trek-muted', text: d.description }));
        } else {
          detailsEl.appendChild(trek.ui.el('p', { class: 'trek-faint', text: 'No description available.' }));
        }
        if (d.images && d.images.length) {
          const strip = trek.ui.el('div', { class: 'ab-photos' });
          for (const url of d.images) {
            const img = document.createElement('img');
            img.alt = '';
            strip.appendChild(img);
            queuePhoto(img, url);
          }
          detailsEl.appendChild(strip);
          loadPhotos();
        }
      } catch (e) {
        detailsEl.textContent = '';
        detailsEl.appendChild(trek.ui.el('p', { class: 'trek-faint', text: 'Could not load details — ' + e.message }));
      }
    }

    function card(l, params) {
      const { ui } = trek;
      const img = document.createElement('img');
      img.className = 'ab-thumb';
      img.alt = '';
      if (l.photoUrl) queuePhoto(img, l.photoUrl);

      const sleeps = [
        l.bedrooms != null ? l.bedrooms + ' bedroom' + (l.bedrooms === 1 ? '' : 's') : null,
        l.beds != null ? l.beds + ' bed' + (l.beds === 1 ? '' : 's') : null,
      ].filter(Boolean).join(' · ');

      const chips = ui.el('div', { class: 'ab-chips' }, [
        l.rating != null ? ui.chip(l.rating + ' ★' + (l.reviewsCount != null ? ' (' + l.reviewsCount + ')' : ''), 'accent') : null,
        l.isSuperhost ? ui.chip('Superhost', 'success') : null,
        sleeps ? ui.el('span', { class: 'trek-muted', text: sleeps }) : null,
      ].filter(Boolean));

      const alreadyAdded = state.added.has(listingIdOf(l));
      const addBtn = ui.button(alreadyAdded ? 'Added ✓' : 'Add to trip', {
        variant: 'primary',
        onClick: async () => {
          if (!tripId) { trek.notify('error', 'No trip in view.'); return; }
          addBtn.disabled = true;
          try {
            await trek.invoke('/add', { method: 'POST', body: {
              tripId, listing: l, checkin: params && params.checkin, checkout: params && params.checkout,
              adults: params && params.adults,
            }});
            trek.notify('success', 'Added "' + l.title + '" to the trip');
            addBtn.textContent = 'Added ✓';
            const id = listingIdOf(l);
            if (id) state.added.add(id);
          } catch (e) {
            addBtn.disabled = false;
            trek.notify('error', e.message);
          }
        },
      });
      if (alreadyAdded) addBtn.disabled = true;

      const viewBtn = ui.button('View on Airbnb', {
        variant: 'secondary',
        onClick: async () => {
          try {
            await navigator.clipboard.writeText(l.listingUrl);
            trek.notify('info', 'Listing URL copied to clipboard');
          } catch {
            trek.notify('info', l.listingUrl);
          }
        },
      });

      for (const btn of [addBtn, viewBtn]) {
        btn.addEventListener('click', (e) => e.stopPropagation());
      }

      const priceEl = ui.el('div', { class: 'ab-price' });
      priceEl.append(l.priceTotal || '');
      const nights = nightsOf(params);
      const total = priceNumberOf(l);
      const sub = [
        l.priceQualifier || '',
        nights && total ? '≈' + (l.priceTotal[0].match(/\d/) ? '' : l.priceTotal[0]) + Math.round(total / nights) + '/night' : '',
      ].filter(Boolean).join(' · ');
      if (sub) priceEl.appendChild(ui.el('small', { text: sub }));

      const row = ui.el('div', { class: 'ab-result' }, [
        img,
        ui.el('div', { class: 'ab-main' }, [
          ui.el('div', { class: 'ab-title-row' }, [
            ui.el('div', { class: 'ab-title', text: l.title }),
            priceEl,
          ]),
          ui.el('div', { class: 'trek-muted ab-sub', text: l.subtitle || '' }),
          chips,
          ui.el('div', { class: 'ab-actions' }, [addBtn, viewBtn]),
        ]),
      ]);
      const detailsEl = ui.el('div', { class: 'ab-details' });
      row.addEventListener('click', () => toggleDetails(l, detailsEl));

      return ui.el('div', { class: 'trek-card trek-interactive' }, [row, detailsEl]);
    }
  </script>
</body>
</html>
